<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Manager</title>
    <meta name="description" content="A beautiful neumorphic bookmark manager to save and organize your favorite links.">
    
    <!-- Styles -->
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1><img src="icon48.png" alt="logo" class="header-logo"> BM</h1>
            
            <!-- Search Section in Header -->
            <div class="header-search">
                <div class="search-wrapper">
                    <span class="icon">🔍</span>
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="search-input" 
                        placeholder="⌘/Ctrl + K to Search bookmarks..."
                        autocomplete="off"
                    >
                    <div class="stats-count" id="statsCount">
                        <span id="bookmarkCount">0</span>
                    </div>
                </div>
            </div>
            
            <div class="header-actions">
                <!-- Date/Time Display -->
                <div class="status-indicator" id="dateTimeDisplay" title="Current time">
                    <span class="status-icon" id="timeIcon">🕐</span>
                    <span class="status-text" id="timeText">--:--</span>
                </div>
                <!-- Network Status -->
                <div class="status-indicator" id="networkStatus" title="Network connection">
                    <span class="status-icon" id="networkIcon">📶</span>
                </div>
                <!-- Memory Usage -->
                <div class="status-indicator" id="memoryStatus" title="Browser memory usage">
                    <span class="status-icon">💾</span>
                    <span class="status-text" id="memoryText">--</span>
                </div>
                <!-- Add New Bookmark Toggle Button -->
                <button class="btn-add-toggle" id="addToggleBtn" title="Add new bookmark (⌘/Ctrl+N)">
                    <span class="btn-icon">➕</span>
                    <span class="btn-text">New</span>
                </button>
                <!-- Theme Toggle -->
                <button class="theme-toggle" id="themeToggle" title="Toggle theme">
                    <span class="theme-icon" id="themeIcon">🌙</span>
                </button>
                <!-- Settings Button -->
                <button class="settings-toggle" id="settingsToggle" title="Settings">
                    <span class="settings-icon">⚙️</span>
                </button>
            </div>
        </header>

        <!-- Add Bookmark Form (Hidden by default) -->
        <form id="addBookmarkForm" class="bookmark-form hidden">
            <div class="form-header">
                <span class="form-label">Add Bookmark</span>
                <span class="fetch-status" id="fetchStatus"></span>
            </div>
            <div class="form-row">
                <div class="input-group input-url-group">
                    <div class="input-wrapper">
                        <span class="icon">🔗</span>
                        <input 
                            type="url" 
                            id="urlInput" 
                            class="form-control" 
                            placeholder="Paste URL and we'll fetch the details..." 
                            required
                            autocomplete="off"
                        >
                    </div>
                </div>
                <div class="input-group">
                    <div class="input-wrapper">
                        <span class="icon">📝</span>
                        <input 
                            type="text" 
                            id="titleInput" 
                            class="form-control" 
                            placeholder="Title (auto-fetched if empty)" 
                            autocomplete="off"
                        >
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div class="input-group input-desc-group">
                    <div class="input-wrapper">
                        <span class="icon icon-top">📄</span>
                        <textarea 
                            id="descInput" 
                            class="form-control form-textarea" 
                            placeholder="Description (auto-fetched if empty)"
                            rows="2"
                        ></textarea>
                    </div>
                </div>
                <button type="submit" class="btn-primary">
                    <span>➕</span>
                    <span>Add</span>
                </button>
            </div>
        </form>



        <!-- Weather Card - Compact like bookmark-card -->
        <div id="weatherCard" class="weather-card hidden">
            <!-- Refresh Button (corner) -->
            <button class="weather-refresh-btn" id="weatherRefreshBtn" title="Refresh weather"><span style="scale:2;">↻</span></button>
            <div class="weather-loading hidden" id="weatherLoading">
                <div class="spinner"></div>
                <span>Loading...</span>
            </div>
            <div class="weather-content hidden" id="weatherContent">
                <!-- Current Weather Row -->
                <div class="weather-current">
                    <!-- Icon on left like favicon -->
                    <div class="weather-icon-wrapper" id="weatherIconWrapper">
                        <span class="weather-icon" id="weatherIcon">☀️</span>
                    </div>
                    <!-- Info on right like bookmark-info -->
                    <div class="weather-info">
                        <div class="weather-header">
                            <span class="weather-location" id="weatherLocation">--</span>
                            <span class="weather-updated" id="weatherUpdated">--</span>
                        </div>
                        <div class="weather-main">
                            <div class="weather-temp-section">
                                <span class="weather-temp" id="weatherTemp">--°</span>
                                <span class="weather-condition" id="weatherCondition">--</span>
                            </div>
                        </div>
                        <div class="weather-stats">
                            <div class="weather-stat">
                                <span class="stat-icon">💧</span>
                                <span class="stat-value" id="weatherHumidity">--%</span>
                            </div>
                            <div class="weather-stat">
                                <span class="stat-icon">💨</span>
                                <span class="stat-value" id="weatherWind">--</span>
                            </div>
                            <div class="weather-stat">
                                <span class="stat-icon">🌡️</span>
                                <span class="stat-value" id="weatherFeelsLike">--°</span>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 5-Day Forecast -->
                <div class="weather-forecast" id="weatherForecast">
                    <!-- Forecast days will be rendered by JS -->
                </div>
            </div>
            <div class="weather-error hidden" id="weatherError">
                <span class="error-icon">⚠️</span>
                <span class="error-text" id="weatherErrorText">Unable to load weather</span>
            </div>
        </div>

        <!-- Bookmark List -->
        <div id="bookmarksContainer" class="bookmark-list">

            
            <!-- Loading State -->
            <div class="loading" id="loadingState">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay hidden" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ Settings</h2>
                <button class="modal-close" id="settingsClose">✕</button>
            </div>
            <div class="modal-body">
                <!-- Show/Hide Indicators -->
                <div class="settings-section">
                    <h3>Status Indicators</h3>
                    <div class="settings-row">
                        <label for="showDateTime">🕐 Show Date/Time</label>
                        <input type="checkbox" id="showDateTime" class="toggle-checkbox" checked>
                    </div>
                    <div class="settings-row">
                        <label for="showNetwork">📶 Show Network</label>
                        <input type="checkbox" id="showNetwork" class="toggle-checkbox" checked>
                    </div>
                    <div class="settings-row">
                        <label for="showMemory">💾 Show Memory</label>
                        <input type="checkbox" id="showMemory" class="toggle-checkbox" checked>
                    </div>
                </div>
                <!-- Timezone Setting -->
                <div class="settings-section">
                    <h3>Timezone</h3>
                    <div class="settings-row">
                        <label for="timezoneSelect">Select Timezone</label>
                        <select id="timezoneSelect" class="settings-select">
                            <option value="local">Local (Device)</option>
                            <option value="UTC">UTC</option>
                            <option value="America/New_York">New York (EST)</option>
                            <option value="America/Los_Angeles">Los Angeles (PST)</option>
                            <option value="Europe/London">London (GMT)</option>
                            <option value="Europe/Paris">Paris (CET)</option>
                            <option value="Asia/Tokyo">Tokyo (JST)</option>
                            <option value="Asia/Kolkata">India (IST)</option>
                            <option value="Asia/Dubai">Dubai (GST)</option>
                            <option value="Australia/Sydney">Sydney (AEDT)</option>
                        </select>
                    </div>
                </div>
                <!-- Weather Settings -->
                <div class="settings-section">
                    <h3>🌤️ Weather</h3>
                    <div class="settings-row">
                        <label for="weatherEnabled">Enable Weather Widget</label>
                        <input type="checkbox" id="weatherEnabled" class="toggle-checkbox">
                    </div>
                    <div class="settings-row" id="apiKeyRow">
                        <label for="weatherApiKey">OpenWeatherMap API Key</label>
                        <div class="api-key-input">
                            <input type="password" id="weatherApiKey" class="settings-input" placeholder="Enter API key...">
                            <button type="button" class="api-key-toggle" id="apiKeyToggle">👁️</button>
                        </div>
                    </div>
                    <div class="settings-row">
                        <label for="weatherCity">City</label>
                        <select id="weatherCity" class="settings-select">
                            <option value="">Auto-detect (IP)</option>
                            <optgroup label="India">
                                <option value="Bardhaman,IN">Bardhaman (Burdwan)</option>
                                <option value="Kolkata,IN">Kolkata</option>
                                <option value="Mumbai,IN">Mumbai</option>
                                <option value="Delhi,IN">Delhi</option>
                                <option value="Bangalore,IN">Bangalore</option>
                                <option value="Chennai,IN">Chennai</option>
                                <option value="Hyderabad,IN">Hyderabad</option>
                            </optgroup>
                            <optgroup label="Asia">
                                <option value="Tokyo,JP">Tokyo, Japan</option>
                                <option value="Singapore,SG">Singapore</option>
                                <option value="Hong Kong,HK">Hong Kong</option>
                                <option value="Dubai,AE">Dubai, UAE</option>
                                <option value="Bangkok,TH">Bangkok, Thailand</option>
                            </optgroup>
                            <optgroup label="Europe">
                                <option value="London,GB">London, UK</option>
                                <option value="Paris,FR">Paris, France</option>
                                <option value="Berlin,DE">Berlin, Germany</option>
                                <option value="Amsterdam,NL">Amsterdam</option>
                                <option value="Rome,IT">Rome, Italy</option>
                            </optgroup>
                            <optgroup label="Americas">
                                <option value="New York,US">New York, USA</option>
                                <option value="Los Angeles,US">Los Angeles, USA</option>
                                <option value="San Francisco,US">San Francisco, USA</option>
                                <option value="Atlanta,US">Atlanta, Georgia</option>
                                <option value="Toronto,CA">Toronto, Canada</option>
                                <option value="Sao Paulo,BR">São Paulo, Brazil</option>
                            </optgroup>
                            <optgroup label="Australia & Oceania">
                                <option value="Sydney,AU">Sydney, Australia</option>
                                <option value="Melbourne,AU">Melbourne, Australia</option>
                                <option value="Auckland,NZ">Auckland, NZ</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="settings-row">
                        <label for="tempUnit">Temperature Unit</label>
                        <select id="tempUnit" class="settings-select">
                            <option value="celsius">Celsius (°C)</option>
                            <option value="fahrenheit">Fahrenheit (°F)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <!-- Scripts -->
    <script src="db.js"></script>
    <script src="popup.js"></script>
</body>
</html>
